<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Palestra</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff4444;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-top: 40px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .hidden { display: none !important; }
        
        /* Menu Giorni */
        .day-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent);
            cursor: pointer;
        }
        .day-card h2 { margin: 0 0 5px 0; font-size: 18px; }
        .day-card p { margin: 0; color: var(--text-muted); font-size: 14px; }

        /* Workout Screen */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .progress { color: var(--text-muted); font-size: 14px; }
        
        .workout-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .workout-card h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--accent); font-weight: bold; font-size: 18px; }

        /* Azioni */
        .action-area { text-align: center; margin-top: 40px; }
        .btn-complete {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        
        /* Timer */
        .timer-text { font-size: 60px; font-weight: bold; color: var(--danger); margin: 0; }
        .timer-sub { color: var(--text-muted); margin-bottom: 20px; }
        .btn-skip {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Schermata Principale -->
    <div id="homeScreen">
        <h1>Le Mie Schede</h1>
        <div id="daysList"></div>
    </div>

    <!-- Schermata Allenamento -->
    <div id="workoutScreen" class="hidden">
        <div class="header">
            <span class="back-btn" onclick="goHome()">← Indietro</span>
            <span class="progress" id="progressText"></span>
        </div>

        <div class="workout-card">
            <h2 id="exName"></h2>
            <div class="info-row">
                <span class="info-label">Set Corrente:</span>
                <span class="info-value" id="exSet"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Ripetizioni:</span>
                <span class="info-value" id="exReps"></span>
            </div>
            <div class="info-row">
                <span class="info-label">RIR Obiettivo:</span>
                <span class="info-value" id="exRir"></span>
            </div>
        </div>

        <div class="action-area">
            <button id="completeBtn" class="btn-complete" onclick="completeSet()">COMPLETA SET</button>
            
            <div id="restArea" class="hidden">
                <p class="timer-text" id="timerDisplay">0:00</p>
                <p class="timer-sub">di recupero</p>
                <button class="btn-skip" onclick="skipRest()">Salta Recupero</button>
            </div>
        </div>
    </div>

    <script>
        let workoutData = null;
        let selectedDay = null;
        let currentExIndex = 0;
        let currentSet = 1;
        let timeLeft = 0;
        let timerInterval = null;

        // Caricamento del file JSON
        fetch('workout.json')
            .then(response => response.json())
            .then(data => {
                workoutData = data;
                renderHome();
            })
            .catch(error => alert("Errore nel caricamento del file workout.json"));

        function renderHome() {
            const list = document.getElementById('daysList');
            list.innerHTML = '';
            workoutData.days.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.onclick = () => startWorkout(day);
                card.innerHTML = `
                    <h2>${day.name}</h2>
                    <p>${day.exercises.length} Esercizi</p>
                `;
                list.appendChild(card);
            });
        }

        function startWorkout(day) {
            selectedDay = day;
            currentExIndex = 0;
            currentSet = 1;
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('workoutScreen').classList.remove('hidden');
            updateWorkoutUI();
        }

        function goHome() {
            clearInterval(timerInterval);
            document.getElementById('homeScreen').classList.remove('hidden');
            document.getElementById('workoutScreen').classList.add('hidden');
        }

        function updateWorkoutUI() {
            const ex = selectedDay.exercises[currentExIndex];
            document.getElementById('progressText').innerText = `Esercizio ${currentExIndex + 1} di ${selectedDay.exercises.length}`;
            document.getElementById('exName').innerText = ex.name;
            document.getElementById('exSet').innerText = `${currentSet} / ${ex.sets}`;
            document.getElementById('exReps').innerText = ex.reps;
            document.getElementById('exRir').innerText = ex.rir;
            
            showRestArea(false);
        }

        function completeSet() {
            const ex = selectedDay.exercises[currentExIndex];
            
            if (currentSet < ex.sets) {
                currentSet++;
                startRest(ex.restSeconds);
            } else {
                if (currentExIndex < selectedDay.exercises.length - 1) {
                    currentExIndex++;
                    currentSet = 1;
                    startRest(ex.restSeconds);
                } else {
                    alert("Allenamento Completato! Ottimo lavoro.");
                    goHome();
                }
            }
        }

        function startRest(seconds) {
            timeLeft = seconds;
            showRestArea(true);
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showRestArea(false);
                    updateWorkoutUI(); // Aggiorna l'UI per il nuovo set
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(timerInterval);
            showRestArea(false);
            updateWorkoutUI();
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showRestArea(isResting) {
            if (isResting) {
                document.getElementById('completeBtn').classList.add('hidden');
                document.getElementById('restArea').classList.remove('hidden');
            } else {
                document.getElementById('completeBtn').classList.remove('hidden');
                document.getElementById('restArea').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
