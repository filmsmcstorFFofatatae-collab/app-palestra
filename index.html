<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Palestra</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --techno-gold: #FDB913; /* Giallo oro stile Technogym */
            --success: #3aab94;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-top: 40px;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        /* Selettore Schede */
        .workout-selector-container {
            margin-bottom: 25px;
            text-align: center;
        }
        .workout-select {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            outline: none;
            appearance: none;
            text-align: center;
        }

        /* Menu Giorni & Lista Esercizi */
        .day-card, .ex-list-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .day-card { border-left: 5px solid var(--accent); }
        .day-card h2 { margin: 0 0 5px 0; font-size: 18px; }
        .day-card p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .ex-list-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--techno-gold);
        }
        .ex-list-card.completed {
            border-left: 5px solid var(--success);
            opacity: 0.6;
        }
        
        .ex-list-card > div:first-child {
            flex: 1; 
            padding-right: 15px; 
        }
        .ex-status {
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap; 
            flex-shrink: 0; 
        }

        .ex-list-card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .ex-list-card p { margin: 0; color: var(--text-muted); font-size: 13px; }

        /* Workout Screen */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            padding: 5px 0;
        }
        .progress { color: var(--text-muted); font-size: 14px; text-align: right; }
        
        .workout-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .workout-card h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 20px; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--accent); font-weight: bold; font-size: 18px; }
        
        /* Input Pesi/Secondi */
        .custom-input {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--accent);
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            width: 80px;
            padding: 8px;
            border-radius: 8px;
        }

        /* Azioni & Timer */
        .action-area { text-align: center; margin-top: 30px; }
        .btn-complete {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        
        .timer-text { font-size: 60px; font-weight: bold; color: var(--techno-gold); margin: 0; }
        .timer-sub { color: var(--text-muted); margin-bottom: 20px; }
        .btn-skip {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-export {
            display: block;
            margin: 40px auto;
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        .btn-video {
            display: inline-block;
            background-color: var(--techno-gold);
            color: #000;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .explanation-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .explanation-divider {
            border-top: 1px dashed #333;
            margin: 15px 0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Schermata Principale (Lista Schede) -->
    <div id="homeScreen">
        <h1>Le Mie Schede</h1>
        
        <!-- NUOVO: Selettore del file JSON della scheda -->
        <div class="workout-selector-container">
            <select id="workoutSelect" class="workout-select" onchange="changeWorkoutFile(this.value)">
                <!-- Puoi aggiungere qui tutte le schede (file JSON) che crei -->
                <option value="workout.json">Scheda Ipertrofia 4 Giorni</option>
                <option value="workout2.json">Scheda 3 Giorni (Nuova)</option>
                <!-- Aggiungi altri file così: <option value="workout3.json">Nome Scheda 3</option> -->
            </select>
        </div>

        <h2 id="currentWorkoutName" style="text-align: center; color: var(--techno-gold); font-size: 16px;"></h2>
        <div id="daysList"></div>
        <button class="btn-export" onclick="exportData()">⬇ Esporta Dati Storico</button>
    </div>

    <!-- Schermata Panoramica Giorno (Lista Esercizi) -->
    <div id="overviewScreen" class="hidden">
        <div class="header">
            <span class="back-btn" onclick="goHome()">← Home</span>
            <span class="progress" id="dayTitle"></span>
        </div>
        <div id="exerciseList"></div>
    </div>

    <!-- Schermata Allenamento (Singolo Esercizio) -->
    <div id="workoutScreen" class="hidden">
        <div class="header">
            <span class="back-btn" onclick="goToOverview()">← Indietro</span>
            <span class="progress" id="progressText"></span>
        </div>

        <div class="workout-card">
            <h2 id="exName"></h2>
            <p id="exTarget" style="text-align: center; color: var(--techno-gold); margin-top: -20px; margin-bottom: 25px; font-size: 14px; font-weight: bold;"></p>
            
            <div id="exExplanationContainer" class="hidden">
                <p id="exExplanation" class="explanation-text"></p>
                <a id="exVideoBtn" href="#" target="_blank" class="btn-video"> Guarda Video</a>
            </div>
            
            <div id="exExplanationContainer2" class="hidden explanation-divider">
                <p id="exExplanation2" class="explanation-text"></p>
                <a id="exVideoBtn2" href="#" target="_blank" class="btn-video"> Guarda Video (Alternativa)</a>
            </div>

            <div id="activeTimerArea" class="hidden action-area" style="margin-top:0; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #333;">
                <p class="timer-text" id="activeTimerDisplay" style="color: var(--accent); font-size: 45px;">0:00</p>
                <button class="btn-skip" onclick="startActiveTimer()">Avvia Esecuzione</button>
            </div>

            <div class="info-row">
                <span class="info-label">Set Corrente:</span>
                <span class="info-value" id="exSet"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Ripetizioni / RIR:</span>
                <span class="info-value" id="exRepsRir"></span>
            </div>
            
            <div class="info-row">
                <span class="info-label" id="inputLabel">Carico (kg):</span>
                <input type="number" id="exInput" class="custom-input" placeholder="0">
            </div>
        </div>

        <div class="action-area">
            <button id="completeBtn" class="btn-complete" onclick="completeSet()">COMPLETA SET</button>
            
            <div id="restArea" class="hidden">
                <p class="timer-text" id="restTimerDisplay">0:00</p>
                <p class="timer-sub">di recupero</p>
                <button class="btn-skip" onclick="skipRest()">Salta Recupero</button>
            </div>
        </div>
    </div>

    <script>
        let workoutData = null;
        let selectedDay = null;
        let currentExIndex = 0;
        let currentSet = 1;
        let currentFile = 'workout.json'; // File di default
        
        let sessionProgress = JSON.parse(localStorage.getItem('sessionProgress')) || {}; 
        let savedHistory = JSON.parse(localStorage.getItem('workoutHistory')) || {};
    
        let restInterval = null;
        let activeInterval = null;
    
        // Salva lo stato includendo anche il file JSON attuale
        function saveAppState(screen) {
            const state = {
                screen: screen,
                dayId: selectedDay ? selectedDay.id : null,
                exIndex: currentExIndex,
                file: currentFile,
                timestamp: Date.now()
            };
            localStorage.setItem('appState', JSON.stringify(state));
            localStorage.setItem('sessionProgress', JSON.stringify(sessionProgress));
        }
    
        // Ripristina lo stato
        function restoreAppState() {
            const state = JSON.parse(localStorage.getItem('appState'));
            if (!state) {
                loadWorkoutFile(currentFile);
                return;
            }
            
            // Se la sessione è più vecchia di 12 ore, cancellala
            if (Date.now() - state.timestamp > 12 * 60 * 60 * 1000) {
                localStorage.removeItem('appState');
                localStorage.removeItem('sessionProgress');
                sessionProgress = {};
                loadWorkoutFile(currentFile);
                return;
            }

            // Ripristina il file corretto
            if (state.file) {
                currentFile = state.file;
                document.getElementById('workoutSelect').value = currentFile;
            }
    
            // Carica il file, poi ripristina la schermata
            loadWorkoutFile(currentFile, () => {
                if (state.screen === 'overview' && state.dayId) {
                    const day = workoutData.days.find(d => d.id === state.dayId);
                    if (day) openDayOverview(day, false);
                } else if (state.screen === 'workout' && state.dayId) {
                    const day = workoutData.days.find(d => d.id === state.dayId);
                    if (day) {
                        selectedDay = day;
                        currentExIndex = state.exIndex || 0;
                        if (!sessionProgress[day.id]) {
                            sessionProgress[day.id] = {};
                            day.exercises.forEach((ex, i) => sessionProgress[day.id][i] = 0);
                        }
                        currentSet = sessionProgress[day.id][currentExIndex] + 1;
                        
                        document.getElementById('homeScreen').classList.add('hidden');
                        document.getElementById('workoutScreen').classList.remove('hidden');
                        updateWorkoutUI();
                    }
                }
            });
        }
    
        // Funzione per caricare dinamicamente un file JSON
        function loadWorkoutFile(filename, callback = null) {
            fetch(filename)
                .then(response => {
                    if (!response.ok) throw new Error("File non trovato");
                    return response.json();
                })
                .then(data => {
                    workoutData = data;
                    document.getElementById('currentWorkoutName').innerText = data.programName || '';
                    renderHome();
                    if (callback) callback();
                })
                .catch(error => {
                    alert("Errore nel caricamento di " + filename + ". Assicurati che il file esista nella stessa cartella.");
                    console.error(error);
                });
        }

        // Chiamata quando cambi selezione nel menu a tendina
        function changeWorkoutFile(filename) {
            currentFile = filename;
            // Pulisce lo stato della sessione attiva (altrimenti potresti avere un ID giorno sfalsato)
            localStorage.removeItem('appState');
            localStorage.removeItem('sessionProgress');
            sessionProgress = {}; 
            
            loadWorkoutFile(filename, () => {
                saveAppState('home');
            });
        }
    
        // Avvio iniziale
        restoreAppState();
    
        function renderHome() {
            const list = document.getElementById('daysList');
            list.innerHTML = '';
            if(!workoutData || !workoutData.days) return;
            
            workoutData.days.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.onclick = () => openDayOverview(day);
                card.innerHTML = `
                    <h2>${day.name}</h2>
                    <p>${day.exercises.length} Esercizi</p>
                `;
                list.appendChild(card);
            });
        }
    
        function goHome() {
            document.getElementById('overviewScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            saveAppState('home');
        }
    
        function openDayOverview(day, save = true) {
            selectedDay = day;
            document.getElementById('dayTitle
