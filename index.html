<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Palestra</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --techno-gold: #FDB913; /* Giallo oro stile Technogym */
            --success: #3aab94;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-top: 40px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .hidden { display: none !important; }
        
        /* Menu Giorni & Lista Esercizi */
        .day-card, .ex-list-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .day-card { border-left: 5px solid var(--accent); }
        .day-card h2 { margin: 0 0 5px 0; font-size: 18px; }
        .day-card p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .ex-list-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--techno-gold); /* Aggiornato al Giallo */
        }
        .ex-list-card.completed {
            border-left: 5px solid var(--success);
            opacity: 0.6;
        }
        
        /* FIX: Prevents text from breaking onto multiple lines */
        .ex-list-card > div:first-child {
            flex: 1; /* Il testo prende lo spazio rimanente */
            padding-right: 15px; /* Spazio per evitare collisioni col numero */
        }
        .ex-status {
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap; /* Impedisce di andare a capo */
            flex-shrink: 0; /* Impedisce al container del numero di rimpicciolirsi */
        }

        .ex-list-card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .ex-list-card p { margin: 0; color: var(--text-muted); font-size: 13px; }

        /* Workout Screen */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            padding: 5px 0;
        }
        .progress { color: var(--text-muted); font-size: 14px; text-align: right; }
        
        .workout-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .workout-card h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 20px; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--accent); font-weight: bold; font-size: 18px; }
        
        /* Input Pesi/Secondi */
        .custom-input {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--accent);
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            width: 80px;
            padding: 8px;
            border-radius: 8px;
        }

        /* Azioni & Timer */
        .action-area { text-align: center; margin-top: 30px; }
        .btn-complete {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        
        .timer-text { font-size: 60px; font-weight: bold; color: var(--techno-gold); margin: 0; }
        .timer-sub { color: var(--text-muted); margin-bottom: 20px; }
        .btn-skip {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-export {
            display: block;
            margin: 40px auto;
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        /* Nuovi stili per Spiegazioni e Video */
        .btn-video {
            display: inline-block;
            background-color: var(--techno-gold);
            color: #000;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .explanation-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .explanation-divider {
            border-top: 1px dashed #333;
            margin: 15px 0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Schermata Principale (Lista Schede) -->
    <div id="homeScreen">
        <h1>Le Mie Schede</h1>
        <div id="daysList"></div>
        <button class="btn-export" onclick="exportData()">⬇ Esporta Dati Storico</button>
    </div>

    <!-- Schermata Panoramica Giorno (Lista Esercizi) -->
    <div id="overviewScreen" class="hidden">
        <div class="header">
            <span class="back-btn" onclick="goHome()">← Home</span>
            <span class="progress" id="dayTitle"></span>
        </div>
        <div id="exerciseList"></div>
    </div>

    <!-- Schermata Allenamento (Singolo Esercizio) -->
    <div id="workoutScreen" class="hidden">
        <div class="header">
            <span class="back-btn" onclick="goToOverview()">← Indietro</span>
            <span class="progress" id="progressText"></span>
        </div>

        <div class="workout-card">
            <h2 id="exName"></h2>
            <p id="exTarget" style="text-align: center; color: var(--techno-gold); margin-top: -20px; margin-bottom: 25px; font-size: 14px; font-weight: bold;"></p>
            
            <!-- Inizio Sezione Spiegazioni e Video -->
            <div id="exExplanationContainer" class="hidden">
                <p id="exExplanation" class="explanation-text"></p>
                <a id="exVideoBtn" href="#" target="_blank" class="btn-video">📹 Guarda Video</a>
            </div>
            
            <div id="exExplanationContainer2" class="hidden explanation-divider">
                <p id="exExplanation2" class="explanation-text"></p>
                <a id="exVideoBtn2" href="#" target="_blank" class="btn-video">📹 Guarda Video (Alternativa)</a>
            </div>
            <!-- Fine Sezione Spiegazioni e Video -->

            <!-- Zona Timer Attivo (es. per Plank) -->
            <div id="activeTimerArea" class="hidden action-area" style="margin-top:0; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #333;">
                <p class="timer-text" id="activeTimerDisplay" style="color: var(--accent); font-size: 45px;">0:00</p>
                <button class="btn-skip" onclick="startActiveTimer()">Avvia Esecuzione</button>
            </div>

            <div class="info-row">
                <span class="info-label">Set Corrente:</span>
                <span class="info-value" id="exSet"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Ripetizioni / RIR:</span>
                <span class="info-value" id="exRepsRir"></span>
            </div>
            
            <!-- Input Pesi o Secondi -->
            <div class="info-row">
                <span class="info-label" id="inputLabel">Carico (kg):</span>
                <input type="number" id="exInput" class="custom-input" placeholder="0">
            </div>
        </div>

        <div class="action-area">
            <button id="completeBtn" class="btn-complete" onclick="completeSet()">COMPLETA SET</button>
            
            <div id="restArea" class="hidden">
                <p class="timer-text" id="restTimerDisplay">0:00</p>
                <p class="timer-sub">di recupero</p>
                <button class="btn-skip" onclick="skipRest()">Salta Recupero</button>
            </div>
        </div>
    </div>

    <script>
        let workoutData = null;
        let selectedDay = null;
        let currentExIndex = 0;
        let currentSet = 1;
        
        // Carica i progressi della sessione o crea un oggetto vuoto
        let sessionProgress = JSON.parse(localStorage.getItem('sessionProgress')) || {}; 
        let savedHistory = JSON.parse(localStorage.getItem('workoutHistory')) || {};
    
        let restInterval = null;
        let activeInterval = null;
    
        // Salva lo stato corrente dell'app per evitare reset
        function saveAppState(screen) {
            const state = {
                screen: screen,
                dayId: selectedDay ? selectedDay.id : null,
                exIndex: currentExIndex,
                timestamp: Date.now()
            };
            localStorage.setItem('appState', JSON.stringify(state));
            localStorage.setItem('sessionProgress', JSON.stringify(sessionProgress));
        }
    
        // Ripristina lo stato al caricamento
        function restoreAppState() {
            const state = JSON.parse(localStorage.getItem('appState'));
            if (!state) return;
            
            // Se la sessione è più vecchia di 12 ore, cancellala
            if (Date.now() - state.timestamp > 12 * 60 * 60 * 1000) {
                localStorage.removeItem('appState');
                localStorage.removeItem('sessionProgress');
                sessionProgress = {};
                return;
            }
    
            if (state.screen === 'overview' && state.dayId) {
                const day = workoutData.days.find(d => d.id === state.dayId);
                if (day) openDayOverview(day, false);
            } else if (state.screen === 'workout' && state.dayId) {
                const day = workoutData.days.find(d => d.id === state.dayId);
                if (day) {
                    selectedDay = day;
                    currentExIndex = state.exIndex || 0;
                    if (!sessionProgress[day.id]) {
                        sessionProgress[day.id] = {};
                        day.exercises.forEach((ex, i) => sessionProgress[day.id][i] = 0);
                    }
                    currentSet = sessionProgress[day.id][currentExIndex] + 1;
                    
                    document.getElementById('homeScreen').classList.add('hidden');
                    document.getElementById('workoutScreen').classList.remove('hidden');
                    updateWorkoutUI();
                }
            }
        }
    
        fetch('workout.json')
            .then(response => response.json())
            .then(data => {
                workoutData = data;
                renderHome();
                restoreAppState();
            })
            .catch(error => alert("Errore nel caricamento di workout.json"));
    
        function renderHome() {
            const list = document.getElementById('daysList');
            list.innerHTML = '';
            workoutData.days.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.onclick = () => openDayOverview(day);
                card.innerHTML = `
                    <h2>${day.name}</h2>
                    <p>${day.exercises.length} Esercizi</p>
                `;
                list.appendChild(card);
            });
        }
    
        function goHome() {
            document.getElementById('overviewScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            saveAppState('home');
        }
    
        function openDayOverview(day, save = true) {
            selectedDay = day;
            document.getElementById('dayTitle').innerText = day.name.split(' ')[0] + " " + day.name.split(' ')[1];
            
            if (!sessionProgress[day.id]) {
                sessionProgress[day.id] = {};
                day.exercises.forEach((ex, i) => sessionProgress[day.id][i] = 0);
            }
    
            renderExerciseList();
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('overviewScreen').classList.remove('hidden');
            if(save) saveAppState('overview');
        }
    
        function renderExerciseList() {
            const list = document.getElementById('exerciseList');
            list.innerHTML = '';
            
            selectedDay.exercises.forEach((ex, i) => {
                const totalSets = ex.sets ? ex.sets : 1; 
                const setsDone = sessionProgress[selectedDay.id][i] || 0;
                const isCompleted = setsDone >= totalSets;
                
                const card = document.createElement('div');
                card.className = `ex-list-card ${isCompleted ? 'completed' : ''}`;
                card.onclick = () => startExercise(i);
                
                card.innerHTML = `
                    <div>
                        <h3>${ex.name}</h3>
                        <p>${ex.reps ? ex.reps + ' | RIR: ' + ex.rir : 'Esercizio libero'}</p>
                        <p style="color: var(--techno-gold); font-size: 11px; margin-top: 3px;">🎯 ${ex.target || 'Riscaldamento / Mobilità'}</p>
                    </div>
                    <div class="ex-status">${setsDone} / ${totalSets}</div>
                `;
                list.appendChild(card);
            });
        }
    
        function goToOverview() {
            clearInterval(restInterval);
            clearInterval(activeInterval);
            document.getElementById('workoutScreen').classList.add('hidden');
            renderExerciseList();
            document.getElementById('overviewScreen').classList.remove('hidden');
            saveAppState('overview');
        }
    
        function startExercise(index) {
            currentExIndex = index;
            const ex = selectedDay.exercises[currentExIndex];
            const totalSets = ex.sets ? ex.sets : 1;
            const setsDone = sessionProgress[selectedDay.id][currentExIndex];
            
            if (setsDone >= totalSets) {
                if (!confirm("Hai già completato i set per questo esercizio. Vuoi ricominciare da capo?")) return;
                sessionProgress[selectedDay.id][currentExIndex] = 0;
            }
            
            currentSet = sessionProgress[selectedDay.id][currentExIndex] + 1;
            
            document.getElementById('overviewScreen').classList.add('hidden');
            document.getElementById('workoutScreen').classList.remove('hidden');
            updateWorkoutUI();
            saveAppState('workout');
        }
    
        function isTimedExercise(ex) {
            if(!ex.reps || !ex.rir) return false;
            const reps = ex.reps.toLowerCase();
            const rir = ex.rir.toLowerCase();
            return reps.includes('s') || rir.includes('isometrica');
        }
    
        function updateWorkoutUI() {
            const ex = selectedDay.exercises[currentExIndex];
            const totalSets = ex.sets ? ex.sets : 1;
            
            document.getElementById('progressText').innerText = `Es. ${currentExIndex + 1} di ${selectedDay.exercises.length}`;
            document.getElementById('exName').innerText = ex.name;
            document.getElementById('exTarget').innerText = ex.target ? `Allena: ${ex.target}` : '';
            document.getElementById('exSet').innerText = `${currentSet} / ${totalSets}`;
            document.getElementById('exRepsRir').innerText = ex.reps ? `${ex.reps} | RIR: ${ex.rir}` : '-';
            
            if (ex.explanation) {
                document.getElementById('exExplanationContainer').classList.remove('hidden');
                document.getElementById('exExplanation').innerText = ex.explanation;
                if (ex.videoLink) {
                    document.getElementById('exVideoBtn').href = ex.videoLink;
                    document.getElementById('exVideoBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('exVideoBtn').style.display = 'none';
                }
            } else {
                document.getElementById('exExplanationContainer').classList.add('hidden');
            }
    
            if (ex.explanation2) {
                document.getElementById('exExplanationContainer2').classList.remove('hidden');
                document.getElementById('exExplanation2').innerText = ex.explanation2;
                if (ex.videoLink2) {
                    document.getElementById('exVideoBtn2').href = ex.videoLink2;
                    document.getElementById('exVideoBtn2').style.display = 'inline-block';
                } else {
                    document.getElementById('exVideoBtn2').style.display = 'none';
                }
            } else {
                document.getElementById('exExplanationContainer2').classList.add('hidden');
            }
    
            const inputField = document.getElementById('exInput');
            if (isTimedExercise(ex)) {
                document.getElementById('inputLabel').innerText = "Secondi Eseguiti:";
                document.getElementById('activeTimerArea').classList.remove('hidden');
                document.getElementById('activeTimerDisplay').innerText = "0:00";
                clearInterval(activeInterval);
            } else {
                document.getElementById('inputLabel').innerText = "Carico (kg):";
                document.getElementById('activeTimerArea').classList.add('hidden');
            }
    
            if (savedHistory[ex.name]) {
                inputField.value = savedHistory[ex.name];
            } else {
                inputField.value = '';
            }
            
            showRestArea(false);
        }
    
        function completeSet() {
            const ex = selectedDay.exercises[currentExIndex];
            const inputValue = document.getElementById('exInput').value;
            const totalSets = ex.sets ? ex.sets : 1;
            
            if (inputValue !== '') {
                savedHistory[ex.name] = inputValue;
                localStorage.setItem('workoutHistory', JSON.stringify(savedHistory));
            }
            
            sessionProgress[selectedDay.id][currentExIndex]++;
            currentSet = sessionProgress[selectedDay.id][currentExIndex] + 1;
            saveAppState('workout');
            
            if (currentSet <= totalSets) {
                const restTime = ex.restSeconds ? ex.restSeconds : 60;
                startRest(restTime);
            } else {
                setTimeout(() => {
                    alert(`Hai completato tutti i set di ${ex.name}!`);
                    goToOverview();
                }, 100);
            }
        }
    
        function startActiveTimer() {
            const inputVal = parseInt(document.getElementById('exInput').value);
            if (!inputVal || inputVal <= 0) {
                alert("Inserisci i secondi che vuoi eseguire nella casella in basso.");
                return;
            }
    
            const endTime = Date.now() + (inputVal * 1000);
            clearInterval(activeInterval);
            
            activeInterval = setInterval(() => {
                let timeLeft = Math.ceil((endTime - Date.now()) / 1000);
                if (timeLeft <= 0) {
                    clearInterval(activeInterval);
                    document.getElementById('activeTimerDisplay').innerText = "FINE!";
                    alert("Tempo di esecuzione scaduto!");
                } else {
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('activeTimerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }
            }, 1000);
        }
    
        function startRest(seconds) {
            showRestArea(true);
            const endTime = Date.now() + (seconds * 1000);
            updateRestDisplay(seconds);
            
            clearInterval(restInterval);
            restInterval = setInterval(() => {
                let timeLeft = Math.ceil((endTime - Date.now()) / 1000);
                if (timeLeft <= 0) {
                    clearInterval(restInterval);
                    showRestArea(false);
                    updateWorkoutUI();
                } else {
                    updateRestDisplay(timeLeft);
                }
            }, 1000);
        }
    
        function updateRestDisplay(timeLeft) {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('restTimerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    
        function skipRest() {
            clearInterval(restInterval);
            showRestArea(false);
            updateWorkoutUI();
        }
    
        function showRestArea(isResting) {
            if (isResting) {
                document.getElementById('completeBtn').classList.add('hidden');
                document.getElementById('activeTimerArea').classList.add('hidden');
                document.getElementById('restArea').classList.remove('hidden');
            } else {
                document.getElementById('completeBtn').classList.remove('hidden');
                document.getElementById('restArea').classList.add('hidden');
            }
        }
    
        function exportData() {
            const dataStr = localStorage.getItem('workoutHistory');
            if (!dataStr || dataStr === '{}') {
                alert("Non hai ancora salvato nessun peso o tempo.");
                return;
            }
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Palestra_Storico_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
